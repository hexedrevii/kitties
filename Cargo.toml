[package]
name = "kitties"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", features = [ "default" ] }
egui_extras = { version = "0.37.0", features = [ "all_loaders" ] }
image = { version = "0.25.10", features = ["png", "jpeg"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.2", features = ["v4"] }
